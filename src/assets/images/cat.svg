<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat Body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#FF8C42" stroke="#E67D32" stroke-width="2"/>
  
  <!-- Cat Head -->
  <circle cx="100" cy="80" r="35" fill="#FF8C42" stroke="#E67D32" stroke-width="2"/>
  
  <!-- Cat Ears -->
  <polygon points="75,55 85,35 95,55" fill="#FF8C42" stroke="#E67D32" stroke-width="2"/>
  <polygon points="105,55 115,35 125,55" fill="#FF8C42" stroke="#E67D32" stroke-width="2"/>
  <polygon points="78,52 82,42 88,52" fill="#FFB366"/>
  <polygon points="112,52 118,42 122,52" fill="#FFB366"/>
  
  <!-- Cat Eyes -->
  <ellipse cx="90" cy="75" rx="6" ry="8" fill="#2D3748"/>
  <ellipse cx="110" cy="75" rx="6" ry="8" fill="#2D3748"/>
  <ellipse cx="92" cy="73" rx="2" ry="3" fill="#FFFFFF"/>
  <ellipse cx="112" cy="73" rx="2" ry="3" fill="#FFFFFF"/>
  
  <!-- Cat Nose -->
  <polygon points="100,85 95,90 105,90" fill="#E53E3E"/>
  
  <!-- Cat Mouth -->
  <path d="M 100 92 Q 95 96 90 94" stroke="#2D3748" stroke-width="2" fill="none"/>
  <path d="M 100 92 Q 105 96 110 94" stroke="#2D3748" stroke-width="2" fill="none"/>
  
  <!-- Cat Whiskers -->
  <line x1="70" y1="82" x2="55" y2="80" stroke="#2D3748" stroke-width="2"/>
  <line x1="70" y1="88" x2="55" y2="90" stroke="#2D3748" stroke-width="2"/>
  <line x1="130" y1="82" x2="145" y2="80" stroke="#2D3748" stroke-width="2"/>
  <line x1="130" y1="88" x2="145" y2="90" stroke="#2D3748" stroke-width="2"/>
  
  <!-- Cat Legs -->
  <rect x="75" y="155" width="12" height="25" rx="6" fill="#FF8C42" stroke="#E67D32" stroke-width="2"/>
  <rect x="95" y="155" width="12" height="25" rx="6" fill="#FF8C42" stroke="#E67D32" stroke-width="2"/>
  <rect x="115" y="155" width="12" height="25" rx="6" fill="#FF8C42" stroke="#E67D32" stroke-width="2"/>
  
  <!-- Cat Paws -->
  <ellipse cx="81" cy="185" rx="8" ry="5" fill="#E67D32"/>
  <ellipse cx="101" cy="185" rx="8" ry="5" fill="#E67D32"/>
  <ellipse cx="121" cy="185" rx="8" ry="5" fill="#E67D32"/>
  
  <!-- Cat Tail -->
  <ellipse cx="145" cy="125" rx="8" ry="25" fill="#FF8C42" stroke="#E67D32" stroke-width="2" transform="rotate(30 145 125)"/>
  
  <!-- Cat Stripes -->
  <ellipse cx="100" cy="70" rx="25" ry="3" fill="#E67D32" opacity="0.3"/>
  <ellipse cx="100" cy="120" rx="35" ry="4" fill="#E67D32" opacity="0.3"/>
  <ellipse cx="100" cy="140" rx="30" ry="3" fill="#E67D32" opacity="0.3"/>
</svg>